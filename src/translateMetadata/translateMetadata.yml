# ============================================================================
# Metadata Translator — Stash v0.31.x 插件清单
#
# 插件 ID 由本文件名决定：translateMetadata
# 所有可调参数都在「设置 -> 插件 -> Metadata Translator」里改，改完无需重载插件。
#
# 注意：Stash 对插件 YAML 使用严格解析，出现未知字段会直接加载失败。
#       本文件只使用 v0.31.1 源码确认过的字段。
# ============================================================================

name: Metadata Translator
description: >-
  把场景 / 演员 / 工作室 / 标签的标题与简介自动翻译成中文。
  支持 AI 翻译（OpenAI 兼容，可接 DeepSeek / Ollama / 智谱等）、Google、DeepL、
  百度、腾讯云、阿里云、Lingva、MyMemory、LibreTranslate、EDGE 免认证接口，
  可配置优先级与失败回退；刮削（场景创建 / 更新）时自动触发，也可在任务页手动批量执行；
  翻译完成后详情页自动刷新显示译文。
version: 1.2.5
url: https://github.com/xheia/stash-plugins

exec:
  - python3
  - "{pluginDir}/translateMetadata.py"

interface: raw
errLog: info

# ---------------------------------------------------------------------------
# 手动任务（设置 -> 任务 -> 插件任务）
# defaultArgs 的值必须是字符串，脚本内部会自行做类型转换。
# ---------------------------------------------------------------------------
tasks:
  - name: 翻译 - 全部（场景 + 演员 + 工作室 + 标签）
    description: 扫描全库，翻译尚未翻译或原文非中文的标题与简介
    defaultArgs:
      mode: all

  - name: 翻译 - 仅场景
    description: 只处理场景的标题与简介
    defaultArgs:
      mode: scene

  - name: 翻译 - 仅演员
    description: 只处理演员的简介（姓名默认不动，可在设置里开启）
    defaultArgs:
      mode: performer

  - name: 翻译 - 仅工作室
    description: 只处理工作室的名称与简介
    defaultArgs:
      mode: studio

  - name: 翻译 - 仅标签
    description: 只处理标签的名称与描述
    defaultArgs:
      mode: tag

  - name: 翻译 - 干跑预览（不写回）
    description: 完整走一遍流程并打印译文，但不修改数据库，用于先确认效果
    defaultArgs:
      mode: all
      dry_run: "true"

  - name: 测试翻译引擎
    description: 逐个调用已配置的引擎翻译一段示例文本，报告连通性与耗时
    defaultArgs:
      mode: selftest

  - name: 回滚翻译（恢复原文）
    description: 从 custom_fields 里取回翻译前的原文并写回，撤销本插件的翻译
    defaultArgs:
      mode: rollback

  - name: 清空翻译缓存
    description: 删除本地翻译缓存，下次翻译会重新请求接口
    defaultArgs:
      mode: clearcache

# ---------------------------------------------------------------------------
# 自动 Hook：刮削写入元数据后自动翻译
#
# 说明：Stash v0.31.1 没有「扫描完成」钩子（源码中明确标注 scan 相关钩子尚未启用），
#       所以自动翻译挂在实体写入之后 —— 刮削器把数据写进数据库时即触发。
# ---------------------------------------------------------------------------
hooks:
  - name: 元数据写入后自动翻译
    description: 场景 / 演员 / 工作室 / 标签被创建或更新时，自动翻译标题与简介
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Performer.Create.Post
      - Performer.Update.Post
      - Studio.Create.Post
      - Studio.Update.Post
      - Tag.Create.Post
      - Tag.Update.Post
    defaultArgs:
      mode: hook

# ---------------------------------------------------------------------------
# 前端脚本：在导航栏加一个「译」按钮，翻译当前打开页面的实体
# ---------------------------------------------------------------------------
ui:
  javascript:
    - ui/translateMetadata.js

# ---------------------------------------------------------------------------
# 设置项（设置 -> 插件 -> Metadata Translator）
#
# 排版说明：Stash 按声明顺序渲染设置页，这里刻意分成六段 ——
#   1 引擎选择  2 翻译范围  3 AI 翻译  4 各引擎凭证  5 网络与限流  6 批量与缓存
# ---------------------------------------------------------------------------
settings:
  # ===== ① 引擎选择 =====
  engine:
    displayName: 主翻译引擎
    description: "可填 openai / deepl / tencent / alibaba / baidu / google /
      mymemory / libretranslate / edge / lingva。免注册：google、mymemory。
      AI 引擎 openai 质量最好；lingva 公共实例已死，仅自托管可用"
    type: STRING

  engine_fallback:
    displayName: 回退引擎链
    description: 主引擎失败时按顺序尝试，英文逗号分隔，如 tencent,alibaba,mymemory
    type: STRING

  # ===== ② 明细参数（所有引擎共用）=====
  source_lang:
    displayName: 源语言
    description: 默认 auto 自动检测
    type: STRING

  target_lang:
    displayName: 目标语言
    description: 默认 zh-CN（简体），可填 zh-TW / en / ja 等
    type: STRING

  batch_size:
    displayName: 每页条数
    description: 批量任务每次从数据库取多少条，默认 100
    type: NUMBER

  max_items:
    displayName: 单次实际翻译上限
    description: 只统计真正翻译的记录；已翻译的跳过不占名额，0 = 不限
    type: NUMBER

  rate_limit_ms:
    displayName: 请求间隔（毫秒）
    description: 两次翻译请求之间的最小间隔，防止打爆接口，默认 300
    type: NUMBER

  timeout_s:
    displayName: 请求超时（秒）
    description: 默认 20，AI 引擎建议 120
    type: NUMBER

  retry_times:
    displayName: 瞬时错误重试次数
    description: 仅对 429 限流与 5xx 重试，默认 1，填 0 不重试
    type: NUMBER

  retry_backoff_ms:
    displayName: 重试等待（毫秒）
    description: 默认 800，按重试次数递增
    type: NUMBER

  # ===== ③ 翻译范围 =====
  translate_title:
    displayName: 翻译标题 / 名称
    description: 场景标题、演员姓名、工作室名称、标签名称
    type: BOOLEAN

  translate_details:
    displayName: 翻译简介
    description: 场景简介、演员简介、工作室简介、标签描述
    type: BOOLEAN

  auto_scene:
    displayName: 自动翻译 - 场景
    description: 场景创建或更新时自动翻译（含刮削器 / 识别写入）
    type: BOOLEAN

  auto_performer:
    displayName: 自动翻译 - 演员
    type: BOOLEAN

  auto_studio:
    displayName: 自动翻译 - 工作室
    type: BOOLEAN

  auto_tag:
    displayName: 自动翻译 - 标签
    description: 标签全局共享，开启前先看下方「标签名称处理方式」
    type: BOOLEAN

  translate_names:
    displayName: 允许翻译人名
    description: 演员姓名属专有名词，默认关闭
    type: BOOLEAN

  tag_name_mode:
    displayName: 标签名称处理方式
    description: "alias = 保留原名并追加中文别名（默认，可逆）；rename = 直接改名"
    type: STRING

  # ===== ④ 内容识别 =====
  skip_existing:
    displayName: 跳过已是中文的内容
    description: 幂等与防死循环的关键，保持开启
    type: BOOLEAN

  ambiguous_cjk:
    displayName: 纯汉字（可能是日文）处理
    description: "skip = 当中文跳过（默认）；detect = 交给引擎检测，日文才翻译"
    type: STRING

  keep_original:
    displayName: 保留原文以便回滚
    description: 原文存入 custom_fields，可用「回滚翻译」任务撤销
    type: BOOLEAN

  # ===== ⑤ AI 翻译（OpenAI 兼容）=====
  openai_base_url:
    displayName: AI - 接口地址
    description: "如 https://api.deepseek.com 或 http://localhost:11434（Ollama）"
    type: STRING

  openai_api_key:
    displayName: AI - KEY
    description: Ollama / LM Studio 本地端点可留空
    type: STRING

  openai_model:
    displayName: AI - 模型名
    description: 如 deepseek-chat
    type: STRING

  openai_prompt:
    displayName: AI - 提示词
    description: 可自定义系统提示词，留空用内置
    type: STRING

  # ===== ⑥ 翻译服务凭证（统一 ID / KEY）=====
  tencent_secret_id:
    displayName: 腾讯云 - ID
    description: SecretId
    type: STRING

  tencent_secret_key:
    displayName: 腾讯云 - KEY
    description: SecretKey
    type: STRING

  alibaba_access_key:
    displayName: 阿里云 - ID
    description: AccessKey ID，需在控制台开通机器翻译服务
    type: STRING

  alibaba_access_secret:
    displayName: 阿里云 - KEY
    description: AccessKey Secret
    type: STRING

  baidu_appid:
    displayName: 百度翻译 - ID
    description: AppID
    type: STRING

  baidu_key:
    displayName: 百度翻译 - KEY
    type: STRING

  deepl_api_key:
    displayName: DeepL - KEY
    description: 免费档 Key 以 :fx 结尾
    type: STRING

  libretranslate_url:
    displayName: LibreTranslate - 地址
    description: 默认 http://localhost:5000
    type: STRING

  libretranslate_api_key:
    displayName: LibreTranslate - KEY
    description: 自托管未开鉴权时留空
    type: STRING
