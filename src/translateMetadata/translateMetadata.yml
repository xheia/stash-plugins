# ============================================================================
# Metadata Translator — Stash v0.31.x 插件清单
#
# 插件 ID 由本文件名决定：translateMetadata
# 所有可调参数都在「设置 -> 插件 -> Metadata Translator」里改，改完无需重载插件。
#
# 注意：Stash 对插件 YAML 使用严格解析，出现未知字段会直接加载失败。
#       本文件只使用 v0.31.1 源码确认过的字段。
# ============================================================================

name: Metadata Translator
description: >-
  把场景 / 演员 / 工作室 / 标签的标题与简介自动翻译成中文。
  支持 AI 翻译（OpenAI 兼容，可接 DeepSeek / Ollama / 智谱等）、Google、DeepL、
  百度、腾讯云、阿里云、MyMemory、LibreTranslate、EDGE 免认证接口，
  可配置优先级与失败回退；刮削（场景创建 / 更新）时自动触发，也可在任务页手动批量执行；
  翻译完成后详情页自动刷新显示译文。
version: 1.2.8
url: https://github.com/xheia/stash-plugins

exec:
  - python3
  - "{pluginDir}/translateMetadata.py"

interface: raw
errLog: info

# ---------------------------------------------------------------------------
# 手动任务（设置 -> 任务 -> 插件任务）
# defaultArgs 的值必须是字符串，脚本内部会自行做类型转换。
# ---------------------------------------------------------------------------
tasks:
  - name: 翻译 - 全部（场景 + 演员 + 工作室 + 标签）
    description: 扫描全库，翻译尚未翻译或原文非中文的标题与简介
    defaultArgs:
      mode: all

  - name: 翻译 - 仅场景
    description: 只处理场景的标题与简介
    defaultArgs:
      mode: scene

  - name: 翻译 - 仅演员
    description: 只处理演员的简介（姓名默认不动，可在设置里开启）
    defaultArgs:
      mode: performer

  - name: 翻译 - 仅工作室
    description: 只处理工作室的名称与简介
    defaultArgs:
      mode: studio

  - name: 翻译 - 仅标签
    description: 只处理标签的名称与描述
    defaultArgs:
      mode: tag

  - name: 翻译 - 试跑 20 条（仅场景，不写回）
    description: 设置页已取消「单次实际翻译上限」，需要小批量试跑时用这个任务（max_items 经任务参数下发）
    defaultArgs:
      mode: scene
      dry_run: "true"
      max_items: "20"

  - name: 翻译 - 干跑预览（不写回）
    description: 完整走一遍流程并打印译文，但不修改数据库，用于先确认效果
    defaultArgs:
      mode: all
      dry_run: "true"

  - name: 测试翻译引擎
    description: 逐个调用已配置的引擎翻译一段示例文本，报告连通性与耗时
    defaultArgs:
      mode: selftest

  - name: 初始化默认配置
    description: 把各项默认值（引擎链、请求间隔、接口地址等）补写进设置页；只补空缺，不覆盖已填的值
    defaultArgs:
      mode: initdefaults

  - name: 回滚翻译（恢复原文）
    description: 从 custom_fields 里取回翻译前的原文并写回，撤销本插件的翻译
    defaultArgs:
      mode: rollback

  - name: 清空翻译缓存
    description: 删除本地翻译缓存，下次翻译会重新请求接口
    defaultArgs:
      mode: clearcache

# ---------------------------------------------------------------------------
# 自动 Hook：刮削写入元数据后自动翻译
#
# 说明：Stash v0.31.1 没有「扫描完成」钩子（源码中明确标注 scan 相关钩子尚未启用），
#       所以自动翻译挂在实体写入之后 —— 刮削器把数据写进数据库时即触发。
# ---------------------------------------------------------------------------
hooks:
  - name: 元数据写入后自动翻译
    description: 场景 / 演员 / 工作室 / 标签被创建或更新时，自动翻译标题与简介
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Performer.Create.Post
      - Performer.Update.Post
      - Studio.Create.Post
      - Studio.Update.Post
      - Tag.Create.Post
      - Tag.Update.Post
    defaultArgs:
      mode: hook

# ---------------------------------------------------------------------------
# 前端脚本：在导航栏加一个「译」按钮，翻译当前打开页面的实体
# ---------------------------------------------------------------------------
ui:
  javascript:
    - ui/translateMetadata.js

# ---------------------------------------------------------------------------
# 设置项（设置 -> 插件 -> Metadata Translator）
#
# 排版说明：Stash 按声明顺序渲染设置页，这里刻意分成七段 ——
#   1 引擎选择  2 翻译参数  3 翻译范围  4 内容识别  5 AI 翻译  6 各引擎凭证  7 接口地址
#
# v1.2.7 起撤掉了「单次实际翻译上限 / 请求超时 / 瞬时错误重试次数 / 重试等待」：
# 超时与重试改由各引擎自己的默认值决定（机翻 20s，AI 120s），上限默认不限。
# 需要临时收口时（比如先试跑），在任务的 defaultArgs 里传 max_items / timeout_s 即可。
# ---------------------------------------------------------------------------
settings:
  # ===== ① 引擎选择（只有这一项：按优先级排的引擎链）=====
  engine_fallback:
    displayName: 翻译引擎链（按优先级）
    description: "英文逗号分隔，从左往右依次尝试，第一个可用的引擎完成翻译。
      留空即用内置默认链：tencent,alibaba,baidu,deepl,openai,mymemory,google。
      没配凭证的引擎会被自动跳过，不会浪费请求。
      可填：openai / deepl / tencent / alibaba / baidu / google / mymemory /
      libretranslate / edge（openai 质量最好）"
    type: STRING

  # ===== ② 翻译参数（所有引擎共用）=====
  source_lang:
    displayName: 源语言
    description: 默认 auto 自动检测
    type: STRING

  target_lang:
    displayName: 目标语言
    description: 默认 zh-CN（简体），可填 zh-TW / en / ja 等
    type: STRING

  batch_size:
    displayName: 每页条数
    description: 批量任务每次从数据库取多少条，默认 100
    type: NUMBER

  rate_limit_ms:
    displayName: 请求间隔（毫秒）
    description: 两次翻译请求之间的最小间隔，防止打爆接口，默认 300
    type: NUMBER

  # ===== ③ 翻译范围 =====
  translate_title:
    displayName: 翻译标题 / 名称
    description: 场景标题、演员姓名、工作室名称、标签名称
    type: BOOLEAN

  translate_details:
    displayName: 翻译简介
    description: 场景简介、演员简介、工作室简介、标签描述
    type: BOOLEAN

  auto_scene:
    displayName: 自动翻译 - 场景
    description: 场景创建或更新时自动翻译（含刮削器 / 识别写入）
    type: BOOLEAN

  auto_performer:
    displayName: 自动翻译 - 演员
    type: BOOLEAN

  auto_studio:
    displayName: 自动翻译 - 工作室
    type: BOOLEAN

  auto_tag:
    displayName: 自动翻译 - 标签
    description: 标签全局共享，开启前先看下方「标签名称处理方式」
    type: BOOLEAN

  translate_names:
    displayName: 允许翻译人名
    description: 演员姓名属专有名词，默认关闭
    type: BOOLEAN

  tag_name_mode:
    displayName: 标签名称处理方式
    description: "alias = 保留原名并追加中文别名（默认，可逆）；rename = 直接改名"
    type: STRING

  # ===== ④ 内容识别（一个键管两件事：已是中文 + 纯汉字）=====
  skip_policy:
    displayName: 跳过策略
    description: "smart = 已是中文 / 纯汉字都跳过（默认，最保守）；detect = 已是中文跳过，
      纯汉字交给引擎判断真实语言（日文才翻）；none = 一律翻译（连中文都送引擎）。
      填错按 smart 处理"
    type: STRING

  keep_original:
    displayName: 保留原文以便回滚
    description: 原文存入 custom_fields，可用「回滚翻译」任务撤销
    type: BOOLEAN

  # ===== ⑤ AI 翻译（OpenAI 兼容）=====
  openai_base_url:
    displayName: AI - 接口地址
    description: "如 https://api.deepseek.com 或 http://localhost:11434（Ollama）"
    type: STRING

  openai_api_key:
    displayName: AI - KEY
    description: Ollama / LM Studio 本地端点可留空
    type: STRING

  openai_model:
    displayName: AI - 模型名
    description: 如 deepseek-chat
    type: STRING

  openai_prompt:
    displayName: AI - 提示词
    description: 可自定义系统提示词，留空用内置
    type: STRING

  # ===== ⑥ 翻译服务凭证（统一 ID / KEY）=====
  tencent_secret_id:
    displayName: 腾讯云 - ID
    description: SecretId
    type: STRING

  tencent_secret_key:
    displayName: 腾讯云 - KEY
    description: SecretKey
    type: STRING

  alibaba_access_key:
    displayName: 阿里云 - ID
    description: AccessKey ID，需在控制台开通机器翻译服务
    type: STRING

  alibaba_access_secret:
    displayName: 阿里云 - KEY
    description: AccessKey Secret
    type: STRING

  baidu_appid:
    displayName: 百度翻译 - ID
    description: AppID
    type: STRING

  baidu_key:
    displayName: 百度翻译 - KEY
    type: STRING

  deepl_api_key:
    displayName: DeepL - KEY
    description: 免费档 Key 以 :fx 结尾
    type: STRING

  libretranslate_api_key:
    displayName: LibreTranslate - KEY
    description: 自托管未开鉴权时留空
    type: STRING

  # ===== ⑦ 各翻译服务的接口地址（可选，留空 = 用内置官方地址）=====
  # 用途：换镜像站、走自建反代、内网网关。填根地址或完整接口地址都接受。
  google_url:
    displayName: Google - 接口地址
    description: 留空用官方 translate.googleapis.com（国内需代理，可指到自建反代）
    type: STRING

  edge_url:
    displayName: EDGE - 接口地址
    description: 留空用官方 edge.microsoft.com/translate/translatetext
    type: STRING

  baidu_url:
    displayName: 百度翻译 - 接口地址
    description: 留空用官方 fanyi-api.baidu.com
    type: STRING

  tencent_url:
    displayName: 腾讯云 - 接口地址
    description: 留空用官方 tmt.tencentcloudapi.com；填 tmt.<地域>.tencentcloudapi.com 会自动取地域
    type: STRING

  alibaba_url:
    displayName: 阿里云 - 接口地址
    description: 留空用官方 mt.aliyuncs.com；也可直接填 cn-hangzhou 这类地域
    type: STRING

  mymemory_url:
    displayName: MyMemory - 接口地址
    description: 留空用官方 api.mymemory.translated.net
    type: STRING

  deepl_api_url:
    displayName: DeepL - 接口地址
    description: 留空按 Key 档位自动选 api-free.deepl.com / api.deepl.com
    type: STRING

  libretranslate_url:
    displayName: LibreTranslate - 地址
    description: 该服务没有公共默认实例，需填自托管地址（默认 http://localhost:5000）
    type: STRING
